<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="38" fill="#1565c0"/>
  <!-- Truck body -->
  <rect x="30" y="90" width="90" height="52" rx="6" fill="#fff"/>
  <!-- Truck cab -->
  <path d="M120 110 L120 90 L150 90 L162 110 Z" fill="#fff"/>
  <!-- Wheels -->
  <circle cx="62"  cy="150" r="14" fill="#1565c0" stroke="#fff" stroke-width="5"/>
  <circle cx="140" cy="150" r="14" fill="#1565c0" stroke="#fff" stroke-width="5"/>
  <!-- Window -->
  <rect x="128" y="96" width="22" height="18" rx="3" fill="#90caf9"/>
  <!-- Cargo lines -->
  <line x1="50" y1="108" x2="100" y2="108" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="120" x2="100" y2="120" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
  <!-- Location pin -->
  <circle cx="96" cy="48" r="20" fill="#ff6f00"/>
  <circle cx="96" cy="46" r="8"  fill="#fff"/>
  <line  x1="96" y1="64" x2="96" y2="74" stroke="#ff6f00" stroke-width="5" stroke-linecap="round"/>
</svg>
